<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manette animée</title>
  <style>
    :root {
      --bg: #050505;
      --soft-white: rgba(255,255,255,0.14);
      --mid-white: rgba(255,255,255,0.28);
      --panel: rgba(18,18,18,0.8);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.18), rgba(255,255,255,0.08) 12%, rgba(255,255,255,0.03) 20%, transparent 40%),
        #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 0;
    }

    .glow {
      position: absolute;
      width: min(48vw, 440px);
      height: min(48vw, 440px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 16%, rgba(255,255,255,0.18) 30%, rgba(255,255,255,0.05) 48%, transparent 70%);
      filter: blur(12px);
      opacity: 0.92;
      z-index: 1;
    }

    .controller-wrap {
      position: relative;
      z-index: 2;
      width: min(72vw, 400px);
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: travel 3s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.12));
    }

    .controller {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes travel {
      0% {
        transform: translateX(240px) rotate(-10deg) scale(0.96);
        opacity: 0.7;
      }
      20% {
        transform: translateX(120px) rotate(-3deg) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateX(-170px) rotate(7deg) scale(1.02);
        opacity: 1;
      }
      80% {
        transform: translateX(120px) rotate(2deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateX(240px) rotate(-10deg) scale(0.96);
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow"></div>

    <div class="controller-wrap" aria-label="Manette de jeu animée">
      <svg class="controller" viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manette de jeu">
        <defs>
          <linearGradient id="bodyBase" x1="0" x2="1">
            <stop offset="0%" stop-color="#272b30"/>
            <stop offset="45%" stop-color="#14181d"/>
            <stop offset="100%" stop-color="#090b0e"/>
          </linearGradient>
          <linearGradient id="bodyGloss" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>

        <g>
          <path d="M120 116c-34-52-96-68-140-33-32 26-35 76-5 106 29 28 84 33 118 9l47-31h122l47 31c34 24 89 19 118-9 30-30 27-80-5-106-44-35-106-19-140 33l-28 49H148l-28-49z"
                fill="url(#bodyBase)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

          <path d="M146 92c40-23 85-33 128-33 43 0 88 10 128 33l-17 25c-31-14-66-22-111-22s-80 8-111 22l-17-25z"
                fill="rgba(255,255,255,0.06)"/>

          <path d="M98 142c-14-25-43-36-68-22-21 12-25 42-8 59 17 17 47 20 68 6l25-19h40l-16-24h-41zM422 142c14-25 43-36 68-22 21 12 25 42 8 59-17 17-47 20-68 6l-25-19h-40l16-24h41z"
                fill="rgba(255,255,255,0.05)"/>

          <g transform="translate(146 118)">
            <circle r="30" fill="#090b0d" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
            <circle r="20" fill="#171b1f" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
            <circle r="6" fill="#dfe3e8" opacity="0.8"/>
          </g>

          <g transform="translate(370 118)">
            <circle r="30" fill="#090b0d" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
            <circle r="20" fill="#171b1f" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
            <circle r="6" fill="#dfe3e8" opacity="0.8"/>
          </g>

          <g fill="#1a1f24" stroke="rgba(255,255,255,0.16)" stroke-width="2">
            <rect x="88" y="154" width="28" height="62" rx="12"/>
            <rect x="404" y="154" width="28" height="62" rx="12"/>
          </g>

          <g fill="#dfe3e8" opacity="0.9">
            <circle cx="193" cy="74" r="7"/>
            <circle cx="328" cy="74" r="7"/>
            <circle cx="232" cy="60" r="5"/>
            <circle cx="288" cy="60" r="5"/>
            <circle cx="262" cy="84" r="6"/>
            <circle cx="260" cy="86" r="2.5" fill="#1b1d20"/>
          </g>

          <g fill="#0b0d10" stroke="rgba(255,255,255,0.18)" stroke-width="2">
            <circle cx="193" cy="74" r="9"/>
            <circle cx="328" cy="74" r="9"/>
            <circle cx="232" cy="60" r="7"/>
            <circle cx="288" cy="60" r="7"/>
          </g>

          <g fill="rgba(255,255,255,0.12)">
            <circle cx="195" cy="74" r="2.5"/>
            <circle cx="330" cy="74" r="2.5"/>
          </g>

          <g>
            <rect x="205" y="126" width="52" height="18" rx="8" fill="rgba(255,255,255,0.08)"/>
            <rect x="263" y="126" width="52" height="18" rx="8" fill="rgba(255,255,255,0.08)"/>
          </g>

          <g fill="#f3f5f7" opacity="0.95">
            <circle cx="260" cy="108" r="8"/>
            <circle cx="206" cy="108" r="8"/>
          </g>

          <g fill="#1f2327" stroke="rgba(255,255,255,0.16)" stroke-width="2">
            <path d="M250 168h28v28h-28z"/>
            <path d="M250 168h28v28h-28z" transform="translate(-44 0)"/>
            <path d="M250 168h28v28h-28z" transform="translate(44 0)"/>
          </g>

          <g fill="rgba(255,255,255,0.12)">
            <rect x="120" y="145" width="52" height="12" rx="6"/>
            <rect x="348" y="145" width="52" height="12" rx="6"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
